name: Fieldkit workflow verification
on:
  push:
    branches: ["portfolio/fieldkit-fde"]
    paths: ["fieldkit-fde/**", ".github/workflows/fieldkit-ci.yml"]
  pull_request:
    paths: ["fieldkit-fde/**", ".github/workflows/fieldkit-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fieldkit-fde
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Execute fresh fixture exports
        run: python -m fieldkit export
      - name: Run domain, real HTTP, audit and MCP tests
        run: python scripts/verify.py --require-no-skips
      - name: Check frontend syntax
        run: node --check web/app.js
